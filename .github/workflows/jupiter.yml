name: Jüpiter saatinde kolon üret

# Çekiliş günleri (Salı, Perşembe, Pazar) 07:07–20:07 TR arasında saatte bir çalışır.
# GitHub zamanlanmış işleri geciktirebildiği için (10 dakikalık iş saatte bir
# çalışabiliyor), Jüpiter saati 2 saat içinde başlayacaksa iş o saate kadar bekler
# ve kolonları Jüpiter saatinde üretir. Kaçırılırsa satış kapanana kadar sonraki
# Jüpiter saatleri, onlar da kalmadıysa Venüs saati denenir; o da yoksa hemen
# üretilir. Kolonlar zaten üretildiyse hiçbir şey yapılmaz.
# Otomatik kupon üretimi kullanıcının isteğiyle durduruldu (18 Kasım 2026);
# yeniden başlatmak için aşağıdaki schedule satırlarını geri ekle.
# Elle çalıştırmak için Actions sekmesinden "Run workflow".
on:
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write  # pano verisi (pano_guncelle.sh)

concurrency:
  group: superloto
  cancel-in-progress: false

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Jüpiter saatindeyse kolonları üret
        run: python3 superloto.py --analiz --oyun jupiter --bekle 7200

      - name: Üretildiyse kaydet
        run: |
          if git diff --quiet -- oyun_kolonlari.txt; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oyun_kolonlari.txt
          git commit -m "Oyun kolonları üretildi ($(grep -m1 '^KOLONLAR:' oyun_kolonlari.txt | cut -d' ' -f2))"
          git pull --rebase
          git push
          ./pano_guncelle.sh
        env:
          GH_TOKEN: ${{ github.token }}
