name: Testler

# Her PR'da ve main'e her gönderimde script derlenir ve testler çalışır.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Derleme kontrolü
        run: python3 -m py_compile superloto.py

      - name: Testler
        run: python3 -m unittest discover -s tests -v
