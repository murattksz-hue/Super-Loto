name: Panoyu güncelle

# Pano verisini (issue #12, #13, #17, #19, #21 ve #24) main'e elle gönderilen değişikliklerde
# ya da Actions sekmesinden elle günceller. Otomatik güncellemeler bunu
# superloto.yml ve jupiter.yml içinde kendileri yapar.
on:
  push:
    branches: [main]
    paths: [superloto.csv, oyun_kolonlari.txt, kural_karnesi.csv, pencere_analizi.csv,
            pencere_listeleri.csv, dongu_karnesi.csv, pano_guncelle.sh]
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: pano
  cancel-in-progress: true

jobs:
  pano:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Dosyaları pano issue'larına kopyala
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./pano_guncelle.sh
